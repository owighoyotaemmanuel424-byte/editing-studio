name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npx convex codegen
      - run: npm run typecheck
      - run: npm run build

  render-worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: render-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: render-worker/package.json
      - run: npm install
      - run: npm run typecheck
